<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <!-- Background Gradient: Neutral/Cool Slate Gray -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Subtle Grid Overlay -->
    <pattern id="techGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(255, 255, 255, 0.08)" />
    </pattern>

    <!-- Soft Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.10)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.25)" />
    </radialGradient>
  </defs>

  <!-- Background Rectangles -->
  <rect width="1920" height="600" fill="url(#bgGrad)" />
  <rect width="1920" height="600" fill="url(#techGrid)" />
  <rect width="1920" height="600" fill="url(#centerGlow)" />

  <!-- Subtle Decorative Outer Frame -->
  <rect x="30" y="30" width="1860" height="540" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" stroke-dasharray="10 6" />

  <!-- Corner Tech Accents -->
  <path d="M 30 60 L 30 30 L 60 30" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="3" />
  <path d="M 1890 60 L 1890 30 L 1860 30" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="3" />
  <path d="M 30 540 L 30 570 L 60 570" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="3" />
  <path d="M 1890 540 L 1890 570 L 1860 570" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="3" />

  <!-- Center Content -->
  <g transform="translate(960, 260)" text-anchor="middle">
    <!-- Image/Media Placeholder Icon -->
    <g transform="translate(0, -65)">
      <!-- Outer Rounded Box -->
      <rect x="-65" y="-48" width="130" height="96" rx="18" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.28)" stroke-width="2.5" />
      <!-- Sun circle -->
      <circle cx="-25" cy="-16" r="11" fill="rgba(255, 255, 255, 0.35)" />
      <!-- Mountains -->
      <path d="M -52 34 L -18 -8 L 14 22 L 32 4 L 52 34 Z" fill="rgba(255, 255, 255, 0.28)" />
    </g>

    <!-- Main Title -->
    <text y="55" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="1.5">
      TEKNIK INFORMATIKA (UIS)
    </text>

    <!-- Subtitle -->
    <text y="92" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#cbd5e1" letter-spacing="0.5">
      Fakultas Sains dan Teknologi — Universitas Ibnu Sina
    </text>

    <text y="122" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.3">
      Banner Promosi &amp; Agenda Kegiatan Akademik
    </text>
  </g>
</svg>
