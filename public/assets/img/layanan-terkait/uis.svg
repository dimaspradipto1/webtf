<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Teknik Informatika Official Colored Vector -->
  <defs>
    <radialGradient id="uisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f9dc4b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="uisGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="uisGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9dc4b"/>
      <stop offset="100%" stop-color="#f9dc4b"/>
    </linearGradient>
  </defs>

  <!-- Background circle soft glow -->
  <circle cx="80" cy="80" r="74" fill="url(#uisGlow)"/>
  
  <!-- Outer Ring -->
  <circle cx="80" cy="80" r="70" stroke="url(#uisGreenGrad)" stroke-width="5" fill="#ffffff"/>
  <!-- Inner Ring -->
  <circle cx="80" cy="80" r="63" stroke="url(#uisGoldGrad)" stroke-width="2" stroke-dasharray="6 3" fill="none"/>

  <!-- Five Pointed Star (Golden Academic Excellence) -->
  <polygon points="80,26 86,46 107,46 90,58 97,78 80,66 63,78 70,58 53,46 74,46" fill="url(#uisGoldGrad)" stroke="#000000" stroke-width="1"/>

  <!-- Stylized Open Book (Tridharma Perguruan Tinggi) -->
  <path d="M48 92 C62 86 74 88 80 94 C86 88 98 86 112 92 L112 110 C98 104 86 106 80 112 C74 106 62 104 48 110 Z" fill="url(#uisGreenGrad)"/>
  <path d="M80 94 L80 112" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Arcs / Globe Meridian -->
  <path d="M38 80 Q80 102 122 80" stroke="#000000" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Bold Monogram Text -->
  <text x="80" y="132" text-anchor="middle" fill="#000000" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="2.5">TI</text>
  <text x="80" y="145" text-anchor="middle" fill="#000000" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7.5" font-weight="800" letter-spacing="1.0">TEKNIK INFORMATIKA</text>
</svg>
